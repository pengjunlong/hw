name: Scrape Website and Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 4 * * *' # 北京时间每天12点运行（UTC+8，对应UTC时间4点）
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2 # 拉取最近两次提交

      # 步骤 1: 判断是否需要执行抓取
      - name: Check if scrape is needed
        id: check_scrape
        run: |
          SHOULD_SCRAPE=false
          
          # 情况 1: 定时任务，始终抓取
          if [ "${{ github.event_name }}" == "schedule" ]; then
            SHOULD_SCRAPE=true
            echo "Triggered by schedule."
          # 情况 2: 推送事件，检查 v2ray 目录是否变化
          elif [ "${{ github.event_name }}" == "push" ]; then
            # 获取上次提交和当前提交之间变化的文件列表
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
            if echo "$CHANGED_FILES" | grep -q "^v2ray/"; then
              SHOULD_SCRAPE=true
              echo "v2ray directory changed."
            else
              echo "Non-v2ray files changed. Skipping scrape."
            fi
          fi
          echo "SHOULD_SCRAPE=$SHOULD_SCRAPE" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.check_scrape.outputs.SHOULD_SCRAPE == 'true'
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.check_scrape.outputs.SHOULD_SCRAPE == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch data and save to file
        if: steps.check_scrape.outputs.SHOULD_SCRAPE == 'true'
        run: |
          python v2ray/scrape.py

      - name: Commit and push changes
        if: steps.check_scrape.outputs.SHOULD_SCRAPE == 'true'
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add v2ray.txt
          git commit -m 'Update scraped text'
          git push https://${{ github.actor }}:${{ secrets.ACTIONS_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .  # 指定发布目录

